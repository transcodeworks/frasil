# The Tauri bridge: a workspace of its own, like fuzz/, so that the root
# workspace never builds Tauri and its webview.
[workspace]

[package]
name = "frasil-tauri"
description = "Frasil's observed reads and feeds as Tauri events."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
frasil = { path = "../../crates/frasil" }
# Pinned exactly, as the root workspace pins its dependencies: the Tauri 2
# release this bridge is built and tested against. No runtime feature: the
# bridge is generic over the runtime, and the application brings its own.
tauri = { version = "=2.12.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["test"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
