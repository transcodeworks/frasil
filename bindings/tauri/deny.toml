# The Tauri bridge's workspace: the root deny.toml, and the advisories
# Tauri's own dependencies bring.
# `cargo deny check`: advisories, licences, bans and sources for the whole
# workspace, on every target CI builds for.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained crates with no maintained release to move to, each reached
# only through a pin reviewed on its own. Each entry is revisited when that
# pin moves.
ignore = [
    # `im`, and `bitmaps` and `sized-chunks` under it, come with loro 1.17.0.
    { id = "RUSTSEC-2026-0248", reason = "im, through loro-internal (loro =1.17.0)" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps, through im (loro =1.17.0)" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks, through im (loro =1.17.0)" },
    # A proc macro, on Linux only, through netlink-packet-core under iroh's
    # netwatch (iroh =1.4.1).
    { id = "RUSTSEC-2024-0436", reason = "paste, through netwatch (iroh =1.4.1)" },
    # A TOML reader in UniFFI's generator, which runs at build time only
    # (uniffi =0.31.0).
    { id = "RUSTSEC-2026-0374", reason = "basic-toml, through askama under uniffi_bindgen (uniffi =0.31.0)" },
    # A proc macro, on Linux only, through glib-macros under Tauri's GTK
    # menus and webview (tauri =2.12.5).
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, through glib-macros (tauri =2.12.5)" },
]

[licenses]
# Every licence a dependency may carry. Each one is permissive, except
# MPL-2.0, a file-level copyleft that loro's dependencies `im`, `bitmaps` and
# `sized-chunks` carry, and that asks only that changes to those files stay
# public.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# Every workspace crate is MIT, which the list above allows.
exceptions = []

[licenses.private]
# Check the workspace crates' licences too.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # ring is the only TLS and QUIC crypto provider. OpenSSL's libcrypto
    # enters only as SQLCipher's cipher for frasil's `index` cache on
    # non-Apple native targets, through libsqlite3-sys, and never for TLS.
    { crate = "aws-lc-rs" },
    { crate = "aws-lc-sys" },
    { crate = "openssl-sys", wrappers = ["libsqlite3-sys"] },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
