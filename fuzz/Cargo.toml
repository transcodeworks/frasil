# Coverage-guided fuzz targets for protocol 1's decoders, run with cargo-fuzz
# (libFuzzer) on a nightly toolchain: see scripts/fuzz.sh. This package is its
# own workspace, so the main workspace never builds it or its dependencies.
# Each slice adds the targets for the decoders it writes.
[package]
name = "frasil-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[features]
ext-guests = ["frasil-admission/ext-guests", "frasil-space/ext-guests", "frasil-transport/ext-guests"]
ext-restricted-spaces = ["frasil-keys/ext-restricted-spaces", "frasil-units/ext-restricted-spaces"]
ext-invite-links = ["frasil-admission/ext-invite-links", "frasil-space/ext-invite-links", "frasil-transport/ext-invite-links"]
ext-next-endpoints = ["frasil-transport/ext-next-endpoints"]
ext-deposit-tokens = ["dep:frasil-deposit-tokens", "frasil-libraries/ext-deposit-tokens", "frasil-transport/ext-deposit-tokens"]

[dependencies]
frasil = { path = "../crates/frasil", default-features = false }
frasil-adapter = { path = "../crates/frasil-adapter" }
frasil-adapter-blobs = { path = "../crates/frasil-adapter-blobs" }
frasil-adapter-loro = { path = "../crates/frasil-adapter-loro" }
frasil-adapter-records = { path = "../crates/frasil-adapter-records" }
frasil-admission = { path = "../crates/frasil-admission" }
frasil-app-requests = { path = "../crates/frasil-app-requests" }
frasil-base = { path = "../crates/frasil-base" }
frasil-crypto = { path = "../crates/frasil-crypto" }
frasil-deposit-tokens = { path = "../crates/frasil-deposit-tokens", optional = true }
frasil-ephemeral = { path = "../crates/frasil-ephemeral" }
frasil-events = { path = "../crates/frasil-events" }
frasil-identity = { path = "../crates/frasil-identity" }
frasil-keys = { path = "../crates/frasil-keys" }
frasil-libraries = { path = "../crates/frasil-libraries" }
frasil-peers = { path = "../crates/frasil-peers" }
frasil-space = { features = ["oracle"], path = "../crates/frasil-space" }
frasil-space-file = { path = "../crates/frasil-space-file" }
frasil-store = { path = "../crates/frasil-store", default-features = false }
frasil-transport = { path = "../crates/frasil-transport" }
frasil-units = { features = ["oracle"], path = "../crates/frasil-units" }
libfuzzer-sys = "=0.4.13"
zeroize = "=1.9.1"

# Fuzz builds keep overflow checks and debug assertions on, so that an
# overflow is a crash rather than a wrapped value. cargo-fuzz sets both by
# default; this keeps them if it is run with --release.
[profile.release]
debug-assertions = true
overflow-checks = true
debug = 1

[lints.rust]
missing_docs = "deny"
unsafe_code = "warn"

[[bin]]
name = "base_cbor"
path = "fuzz_targets/base_cbor.rs"
test = false
doc = false
bench = false

