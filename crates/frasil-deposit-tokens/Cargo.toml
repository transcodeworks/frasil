[package]
name = "frasil-deposit-tokens"
description = "Frasil's deposit tokens extension: deposit keys, grants, tokens and their messages, a device's checks and a peer's issuance, redemption, budgets and key rotation. An internal building block of Frasil, less stable than the `frasil` crate: depend on `frasil` instead."
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# `rand_core` re-exports the RNG traits the VOPRF draws through, so that a
# draw's bytes can be replayed; it names no crate voprf does not bring.
curve25519-dalek = { workspace = true, features = ["rand_core"] }
frasil-base = { path = "../frasil-base", version = "0.1.0" }
frasil-crypto = { path = "../frasil-crypto", version = "0.1.0" }
frasil-libraries = { path = "../frasil-libraries", version = "0.1.0", features = ["ext-deposit-tokens"] }
frasil-transport = { path = "../frasil-transport", version = "0.1.0", features = ["ext-deposit-tokens"] }
subtle.workspace = true
voprf.workspace = true
zeroize.workspace = true

[dev-dependencies]
frasil-testkit = { path = "../frasil-testkit" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
