[package]
name = "frasil-admission"
description = "Frasil's admission: the admission code, the setup code, the welcome and access requests. An internal building block of Frasil, less stable than the `frasil` crate: depend on `frasil` instead."
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# ext-invite-links.md: the secret, the link, the drop and the claimant's
# walk. Off by default.
ext-invite-links = [
    "frasil-keys/ext-invite-links",
    "frasil-space/ext-invite-links",
    "frasil-transport/ext-invite-links",
]
# ext-guests.md: offer key 13, the leave request and its checks. Off by
# default.
ext-guests = ["frasil-space/ext-guests", "frasil-transport/ext-guests"]

[dependencies]
frasil-base = { path = "../frasil-base", version = "0.1.0" }
frasil-crypto = { path = "../frasil-crypto", version = "0.1.0" }
frasil-events = { path = "../frasil-events", version = "0.1.0" }
frasil-identity = { path = "../frasil-identity", version = "0.1.0" }
frasil-keys = { path = "../frasil-keys", version = "0.1.0" }
frasil-space = { path = "../frasil-space", version = "0.1.0" }
frasil-transport = { path = "../frasil-transport", version = "0.1.0" }
frasil-units = { path = "../frasil-units", version = "0.1.0" }
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
frasil-peers = { path = "../frasil-peers" }
frasil-testkit = { path = "../frasil-testkit" }
serde_json.workspace = true

[lints]
workspace = true
