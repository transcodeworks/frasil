name: Release

# Publishing jobs run only when the repository variable PUBLISH_ENABLED is
# 'true' (Settings > Secrets and variables > Actions > Variables). Without
# it, release-please still opens release pull requests and, once one is
# merged, tags the release and writes its GitHub release, but the crates,
# npm and container jobs below are skipped. RELEASING.md lists the one-time
# registry setup that comes first.
#
# release-please (release-please-config.json) keeps a release pull request
# open against main, built from the conventional commits since the last
# release: one version for every crate, the npm package and the image, and
# one CHANGELOG.md. Merging it tags vX.Y.Z and publishes, in this run:
#
# - every crate that is not `publish = false` to crates.io, in dependency
#   order (`cargo publish --workspace`), through crates.io trusted
#   publishing: a short-lived token from this workflow's OIDC identity, no
#   stored secret;
# - @frasil/client to npm through npm trusted publishing, with provenance;
# - frasil-relay's image with its semver tags (docker.yml).
#
# A release made with GITHUB_TOKEN starts no other workflow, so the
# publishing happens here rather than on a `release` event.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  crates:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: The pinned Rust version
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - name: A crates.io token from trusted publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # Packages, verifies and uploads each crate after the crates it
      # depends on, waiting for each to appear in the index. A crate whose
      # version is already in the index is left out, so a rerun after a
      # partial failure publishes the rest.
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          exclude=()
          while IFS= read -r name; do
            index="https://index.crates.io/${name:0:2}/${name:2:2}/$name"
            if curl --silent --fail "$index" | jq -e --arg v "$VERSION" 'select(.vers == $v)' > /dev/null; then
              echo "$name $VERSION is already published"
              exclude+=(--exclude "$name")
            fi
          done < <(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name')
          total="$(cargo metadata --locked --no-deps --format-version 1 | jq '[.packages[] | select(.publish != [])] | length')"
          if [ "$(( ${#exclude[@]} / 2 ))" -eq "$total" ]; then
            echo "Every crate of $VERSION is already published"
            exit 0
          fi
          cargo publish --workspace --locked "${exclude[@]}"

  npm:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: The pinned Rust version
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: wasm32-unknown-unknown
      # The pnpm version comes from `packageManager` in package.json.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          install: false
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      # wasm-bindgen at exactly the version Cargo.lock pins, as
      # scripts/check-js.sh installs it, then the package from a clean state.
      - name: Build the package
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          cargo install --locked wasm-bindgen-cli --version "$version" --root target/wasm-tools
          pnpm --dir packages/frasil build
      # The packed package's manifest and the types each entry resolves to,
      # as scripts/check-js.sh checks them; nothing is published if they fail.
      - name: Check the packed package
        run: pnpm --dir packages/frasil check:package
      # Trusted publishing needs npm 11.5.1 or later; it signs the
      # provenance statement with this workflow's OIDC identity.
      - name: Publish @frasil/client
        working-directory: packages/frasil
        run: |
          npm install --global npm@11.21.1
          npm publish --provenance --access public

  container-image:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' && vars.PUBLISH_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
