name: Container image

# frasil-relay's image (packaging/server/Dockerfile) for linux/amd64 and
# linux/arm64, each built on a runner of its own architecture, with no
# emulation. One image serves every operator: every extension is built in,
# and FRASIL_EXTENSIONS turns each on when the peer starts. Each platform is pushed by digest, then one job merges the
# digests into a multi-platform image at ghcr.io/<owner>/frasil-relay.
#
# - A pull request that changes the peer, its packaging or the workspace's
#   manifests builds both platforms and pushes nothing. CI's check job
#   builds the peer for every other change.
# - A push to main publishes `edge` and `sha-<short commit>`.
# - A release publishes `X.Y.Z`, `X.Y`, `X` and, unless it is a
#   prerelease, `latest`. release.yml calls this workflow with the version,
#   and only when the repository variable PUBLISH_ENABLED is 'true'; this
#   workflow checks that variable again before it pushes a release's tags.
#
# The image carries OCI labels and annotations, an SBOM and a SLSA
# provenance attestation, and a GitHub artifact attestation of the merged
# digest. Only the two jobs here may write packages.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/relay/**
      - packaging/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_call:
    inputs:
      version:
        description: The release's version, without a leading v
        required: true
        type: string

concurrency:
  group: container-image-${{ github.event.pull_request.number || github.ref }}-${{ inputs.version || 'edge' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  # Push on main and on a release that publishing allows; never on a pull
  # request.
  PUSH: ${{ github.event_name != 'pull_request' && (inputs.version == '' || vars.PUBLISH_ENABLED == 'true') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: The image's name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frasil-relay" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=frasil-relay
            org.opencontainers.image.description=Frasil's always-on peer service, with an optional iroh relay.
            org.opencontainers.image.licenses=MIT
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
      - name: Record the digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Keep the digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}-${{ inputs.version || 'edge' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request' && (inputs.version == '' || vars.PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: The image's name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frasil-relay" >> "$GITHUB_ENV"
      - name: Fetch the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*-${{ inputs.version || 'edge' }}
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release's semver tags and `latest`; on main, `edge`. Both get
      # `sha-<short commit>`. metadata-action makes no `X` tag while X is 0,
      # and no `X.Y` or `X` tag for a prerelease.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=raw,value=latest,enable=${{ env.VERSION != '' && !contains(env.VERSION, '-') }}
            type=edge,branch=main,enable=${{ env.VERSION == '' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=frasil-relay
            org.opencontainers.image.description=Frasil's always-on peer service, with an optional iroh relay.
            org.opencontainers.image.licenses=MIT
      - name: Create the multi-platform image
        id: merge
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done \
            < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
          first_tag="$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")"
          digest="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$first_tag"
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
