name: Fuzz

# Every fuzz target of fuzz/ and apps/relay/fuzz, built with cargo-fuzz and
# AddressSanitizer on nightly Rust, each run for a bounded time
# (scripts/fuzz.sh). A crash, an out-of-memory input or a timeout fails the
# run, and the inputs that found them are kept as an artifact.
#
# It runs every night on a GitHub-hosted runner, one target per core, and
# stops after 90 minutes whatever happens. Each target's corpus is kept in
# the Actions cache, so it grows from night to night.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds each target runs (at most 180)
        default: '120'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      SECONDS_PER_TARGET: ${{ inputs.seconds || '120' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bound the time per target
        run: |
          case "$SECONDS_PER_TARGET" in
            ''|*[!0-9]*) echo "seconds must be a whole number" >&2; exit 1 ;;
          esac
          [ "$SECONDS_PER_TARGET" -le 180 ] || { echo "seconds must be at most 180" >&2; exit 1; }
      # Nightly for cargo-fuzz and its sanitizers; the pinned toolchain
      # (rust-toolchain.toml) for installing cargo-fuzz.
      - name: The pinned Rust version
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: nightly
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy
      # Each night saves its corpora under a key of its own and starts from
      # the latest earlier one.
      - name: Restore the corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            fuzz/work/
            apps/relay/fuzz/work/
            !fuzz/work/*.log
            !apps/relay/fuzz/work/*.log
          key: fuzz-corpora-${{ github.run_id }}
          restore-keys: fuzz-corpora-
      # scripts/fuzz.sh installs cargo-fuzz, at the version it pins, into
      # target/fuzz-tools.
      - name: Build every target
        run: scripts/fuzz.sh --build-only
      - name: Run every target
        run: scripts/fuzz.sh --jobs "$(nproc)" "$SECONDS_PER_TARGET"
      - name: Keep the findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            fuzz/artifacts/
            fuzz/work/*.log
            apps/relay/fuzz/artifacts/
            apps/relay/fuzz/work/*.log
          if-no-files-found: ignore
