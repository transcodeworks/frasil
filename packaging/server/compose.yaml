# frasil-relay with its data in a named volume, published on host loopback.
# A reverse proxy terminates TLS in front of it and sets FRASIL_ORIGIN to the
# origin clients use. See docs/self-hosting.md.
services:
  relay:
    build:
      context: ../..
      dockerfile: packaging/server/Dockerfile
    image: frasil-relay:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRASIL_PORT:-8787}:8787/tcp"
      - "${FRASIL_IROH_PORT:-8788}:8788/udp"
    environment:
      # The origin clients connect to, such as https://peer.example.org.
      FRASIL_ORIGIN: ${FRASIL_ORIGIN:-}
      # closed: a space is hosted once a ticket of `frasil-relay ticket`
      # attached it. open lets anyone who reaches the peer create spaces.
      FRASIL_HOSTING: ${FRASIL_HOSTING:-closed}
      FRASIL_SPACE_QUOTA_BYTES: ${FRASIL_SPACE_QUOTA_BYTES:-1073741824}
      FRASIL_IROH: ${FRASIL_IROH:-on}
      FRASIL_RELAYS: ${FRASIL_RELAYS:-}
      # The extensions on, such as "libraries deposit-tokens ephemeral
      # invite-links", or "none"; libraries and deposit-tokens when unset.
      # See docs/self-hosting.md, "Extensions".
      FRASIL_EXTENSIONS: ${FRASIL_EXTENSIONS:-}
    volumes:
      - frasil-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  frasil-data:
